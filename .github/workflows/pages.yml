name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build PWA and launcher mirror
        run: pnpm pwa:build

      # Pages is a fallback host, not a second release builder. Download the
      # exact immutable release bundle so its SHA-256 matches the committed
      # channel manifest and the GitHub Release asset.
      - name: Stage companion fallback assets
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('apps/pwa/public/companion-release-manifest.json', 'utf8'))
          fs.writeFileSync('/tmp/she-bundle-url', manifest.bundle.fallbackUrl)
          fs.writeFileSync('/tmp/she-bundle-file', manifest.bundle.file)
          fs.writeFileSync('/tmp/she-bundle-sha', manifest.bundle.sha256)
          fs.writeFileSync('/tmp/she-launcher-sha', manifest.launcher.sha256)
          NODE
          BUNDLE_FILE="$(cat /tmp/she-bundle-file)"
          curl -fL --http1.1 --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180             -o "apps/pwa/dist/$BUNDLE_FILE" "$(cat /tmp/she-bundle-url)"
          echo "$(cat /tmp/she-bundle-sha)  apps/pwa/dist/$BUNDLE_FILE" | sha256sum -c -
          test -f apps/pwa/dist/she-launcher.mjs
          echo "$(cat /tmp/she-launcher-sha)  apps/pwa/dist/she-launcher.mjs" | sha256sum -c -
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('apps/pwa/public/core-release-manifest.json', 'utf8'))
          fs.writeFileSync('/tmp/she-core-bundle-url', manifest.bundle.fallbackUrl)
          fs.writeFileSync('/tmp/she-core-bundle-file', manifest.bundle.file)
          fs.writeFileSync('/tmp/she-core-bundle-sha', manifest.bundle.sha256)
          NODE
          CORE_BUNDLE_FILE="$(cat /tmp/she-core-bundle-file)"
          curl -fL --http1.1 --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -o "apps/pwa/dist/$CORE_BUNDLE_FILE" "$(cat /tmp/she-core-bundle-url)"
          echo "$(cat /tmp/she-core-bundle-sha)  apps/pwa/dist/$CORE_BUNDLE_FILE" | sha256sum -c -

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/pwa/dist

      - name: Wait for artifact propagation
        run: sleep 10

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
