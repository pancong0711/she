name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check stable companion/core scripts
        run: |
          node --check apps/companion/server.mjs
          node --check run-core.mjs
          node scripts/release-manifest.mjs --out /tmp/she-release-manifest.json

      - name: Build and install core bundle
        run: |
          pnpm build:core
          bash scripts/install-core-bundle.sh artifacts/core/she-core-0.1.0.tar.gz --core-root /tmp/she-core-install
          test -x /tmp/she-core-install/current/run-core.sh

      - name: Build PWA
        run: pnpm pwa:build

      - name: Pack public packages
        run: pnpm pack:public
